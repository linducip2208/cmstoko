name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    name: PHP 8.3 — tests, pint, phpstan

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: cmstoko_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl, zip
          coverage: none

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-83-${{ hashFiles('composer.lock') }}
          restore-keys: composer-83-

      - name: Validate composer
        run: composer validate

      - name: Audit dependencies
        run: composer audit --locked || true

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrations (mysql)
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cmstoko_test
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Pint (style)
        run: vendor/bin/pint --test

      - name: PHPStan (level 5 + baseline)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (sqlite in-memory)
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  frontend:
    runs-on: ubuntu-latest
    name: Frontend build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm audit (non-blocking)
        run: npm audit --omit=dev || true

      - name: Install & build
        run: |
          npm ci
          npm run build
